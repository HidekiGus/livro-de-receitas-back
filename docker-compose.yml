services:
  db_livro_de_receitas:
    image: mongo:7
    container_name: db_livro_de_receitas
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo_livro_de_receitas:/data/db

  node_app_livro_de_receitas:
    container_name: livro_de_receitas
    build: .
    ports:
      - 4002:4000
    depends_on:
      - db_livro_de_receitas
    env_file:
      - .env

volumes:
  mongo_livro_de_receitas:
